# Put this at .github/workflows/build.yml in a GitHub repo that also contains
# walrus_talk/walrus_talk.ino  (folder name must match the .ino name)
name: Build Walrus firmware
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "GFX Library for Arduino@1.6.6" "RadioLib@7.1.2"
      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,CDCOnBoot=cdc,PartitionScheme=app3M_fat9M_16MB \
            --export-binaries walrus_talk
      - uses: actions/upload-artifact@v4
        with:
          name: walrus-firmware
          path: walrus_talk/build/**/*.merged.bin
